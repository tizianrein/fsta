<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formholz | Restholz-Schmiede</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪵</text></svg>">
    <style>
        :root {
            --background: #FFFFFF;
            --foreground: #000000;
            --accent: #888888;
        }
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            display: flex;
        }

        /* --- Layout --- */
        #ui-panel {
            width: 380px;
            min-width: 320px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
            height: 100vh;
            box-sizing: border-box;
            border-right: 1px solid #eee;
        }
        #viewer-panel {
            flex-grow: 1;
            height: 100vh;
            position: relative;
        }
        #viewer-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI Elements --- */
        #header h1 { margin: 0; font-size: 24px; }
        #header p { margin: 5px 0 0; color: var(--accent); }

        .input-group { display: flex; flex-direction: column; gap: 10px; }
        .input-group label { font-weight: 600; font-size: 14px; }
        
        #scrapwood-list { display: flex; flex-direction: column; gap: 8px; }
        .scrapwood-row { display: flex; gap: 8px; align-items: center; }
        .scrapwood-row input {
            width: 100%;
            border: 1px solid var(--accent);
            background-color: var(--background);
            color: var(--foreground);
            padding: 8px;
            font-size: 13px;
            box-sizing: border-box;
            text-align: center;
        }
        .scrapwood-row button {
            background: none; border: none; font-size: 18px; color: var(--accent); cursor: pointer; padding: 0 5px;
        }
        .scrapwood-row button:hover { color: var(--foreground); }

        #prompt-input {
            width: 100%;
            border: 1px solid var(--foreground);
            background-color: var(--background);
            color: var(--foreground);
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--foreground);
            cursor: pointer;
            background-color: var(--foreground);
            color: var(--background);
        }
        .btn.secondary {
            background-color: var(--background);
            color: var(--foreground);
        }
        .btn:hover { opacity: 0.8; }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        #status-output {
            margin-top: auto; /* Pushes to the bottom */
            padding-top: 20px;
            font-family: monospace;
            font-size: 13px;
            color: var(--accent);
        }
        
        /* --- 3D Viewer Interactive Elements --- */
        #info-box {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 12px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
            z-index: 100;
            display: none;
            pointer-events: none;
        }

        /* --- Modal --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,.7); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: #fff; padding: 20px; border: 1px solid #000;
            width: 90%; max-width: 500px;
        }
        .modal-content h3 { margin-top: 0; }
        .modal-content textarea { width: 100%; height: 40vh; resize: none; font-family: monospace; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="ui-panel">
        <div id="header">
            <h1>Formholz</h1>
            <p>Die Restholz-Schmiede</p>
        </div>

        <div class="input-group">
            <label>1. Restholzstücke (in cm)</label>
            <div id="scrapwood-list"></div>
            <button id="add-piece-btn" class="btn secondary">Neues Stück hinzufügen +</button>
        </div>

        <div class="input-group">
            <label for="prompt-input">2. Bauanleitung</label>
            <input type="text" id="prompt-input" placeholder="z.B. 'ein kleiner Hocker', 'ein Beistelltisch'">
        </div>

        <div class="input-group">
            <label for="freakyness-slider">3. Kreativität: <span id="freakyness-value">0.5</span></label>
            <input type="range" id="freakyness-slider" min="0" max="1" step="0.1" value="0.5">
        </div>

        <button id="generate-btn" class="btn">Assembly generieren</button>
        
        <div class="controls-grid">
            <button id="explode-view-btn" class="btn secondary">Explodieren</button>
            <button id="reset-view-btn" class="btn secondary" style="display:none;">Reset</button>
            <button id="view-json-btn" class="btn secondary">JSON ansehen</button>
            <button id="download-json-btn" class="btn secondary">Download</button>
            <button id="upload-json-btn" class="btn secondary">Upload</button>
        </div>

        <div id="status-output">Bereit.</div>
    </div>

    <div id="viewer-panel">
        <canvas id="viewer-canvas"></canvas>
        <div id="info-box"></div>
    </div>

    <!-- Hidden file input for upload -->
    <input type="file" id="json-upload-input" accept=".json, .txt" style="display:none;">

    <!-- JSON View Modal -->
    <div id="json-view-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Current Assembly JSON</h3>
            <textarea id="json-textarea" readonly></textarea>
            <div class="modal-actions">
                <button id="copy-json-btn" class="btn">Kopieren</button>
                <button id="close-modal-btn" class="btn secondary">Schließen</button>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- STATE & CONSTANTS ---
        let scene, camera, renderer, controls, raycaster, mouse;
        const objectGroup = new THREE.Group();
        let scrapwoodPieces = [];
        let currentModelJson = null;
        let selectedPartMesh = null;

        // --- DOM ELEMENTS ---
        const uiPanel = document.getElementById('ui-panel');
        const viewerPanel = document.getElementById('viewer-panel');
        const viewerCanvas = document.getElementById('viewer-canvas');
        const statusOutput = document.getElementById('status-output');
        const addPieceBtn = document.getElementById('add-piece-btn');
        const scrapwoodList = document.getElementById('scrapwood-list');
        const infoBox = document.getElementById('info-box');

        // --- MATERIALS ---
        const defaultMaterial = new THREE.MeshStandardMaterial({ color: 0xdeb887, side: THREE.DoubleSide }); // BurlyWood
        const selectionMaterial = new THREE.MeshStandardMaterial({ color: 0x4a90e2, side: THREE.DoubleSide }); // Bright Blue
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            scene.add(objectGroup);

            camera = new THREE.PerspectiveCamera(50, viewerPanel.clientWidth / viewerPanel.clientHeight, 0.01, 1000);
            camera.position.set(0.8, 1.0, 1.2);

            renderer = new THREE.WebGLRenderer({ canvas: viewerCanvas, antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(viewerPanel.clientWidth, viewerPanel.clientHeight);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            scene.add(new THREE.DirectionalLight(0xffffff, 0.7));
            
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            setupEventListeners();
            addPieceRow(); // Start with one empty row
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = viewerPanel.clientWidth / viewerPanel.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewerPanel.clientWidth, viewerPanel.clientHeight);
        }

        function clearModel() {
            while (objectGroup.children.length > 0) {
                objectGroup.remove(objectGroup.children[0]);
            }
            currentModelJson = null;
            selectedPartMesh = null;
            infoBox.style.display = 'none';
        }

        function createModel(jsonData) {
            clearModel();
            currentModelJson = jsonData;
            if (!jsonData || !jsonData.parts) {
                updateStatus("Error: Invalid assembly data.");
                return;
            }

            const allPartsGroup = new THREE.Group();
            jsonData.parts.forEach(part => {
                if (part.status === 'discarded') return;

                const geo = new THREE.BoxGeometry(part.dimensions.width, part.dimensions.height, part.dimensions.depth);
                const mesh = new THREE.Mesh(geo, defaultMaterial);
                mesh.position.set(part.origin.x, part.origin.y, part.origin.z);
                
                // Store part data directly on the mesh for easy access
                mesh.userData.partInfo = part;
                
                allPartsGroup.add(mesh);
            });
            objectGroup.add(allPartsGroup);
            
            const bounds = new THREE.Box3().setFromObject(allPartsGroup);
            const center = bounds.getCenter(new THREE.Vector3());
            const size = bounds.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            
            controls.target.copy(center);
            camera.position.copy(center).add(new THREE.Vector3(1, 0.8, 1).normalize().multiplyScalar(maxDim * 2));
            camera.lookAt(center);

            document.getElementById('reset-view-btn').style.display = 'none';
            document.getElementById('explode-view-btn').style.display = 'inline-block';
            updateStatus(`Assembly loaded with ${jsonData.parts.filter(p => p.status !== 'discarded').length} parts.`);
        }

        function updateStatus(message) {
            statusOutput.textContent = message;
        }

        // --- UI & Event Logic ---
        function addPieceRow(data = { w: '', d: '', h: '', amount: 1 }) {
            const id = `piece-${Date.now()}-${Math.random()}`;
            const pieceData = { id, ...data };
            scrapwoodPieces.push(pieceData);

            const row = document.createElement('div');
            row.className = 'scrapwood-row';
            row.dataset.id = id;
            row.innerHTML = `
                <input type="number" placeholder="B" value="${data.w}" data-prop="w">
                <input type="number" placeholder="T" value="${data.d}" data-prop="d">
                <input type="number" placeholder="H" value="${data.h}" data-prop="h">
                <input type="number" placeholder="Anz" value="${data.amount}" data-prop="amount" min="1">
                <button class="remove-piece-btn">×</button>
            `;
            scrapwoodList.appendChild(row);
        }
        
        function setupEventListeners() {
            window.addEventListener('resize', onWindowResize);
            addPieceBtn.addEventListener('click', () => addPieceRow());

            scrapwoodList.addEventListener('click', e => {
                if (e.target.classList.contains('remove-piece-btn')) {
                    const row = e.target.closest('.scrapwood-row');
                    const idToRemove = row.dataset.id;
                    scrapwoodPieces = scrapwoodPieces.filter(p => p.id !== idToRemove);
                    row.remove();
                }
            });

            scrapwoodList.addEventListener('input', e => {
                const input = e.target;
                const row = input.closest('.scrapwood-row');
                const id = row.dataset.id;
                const prop = input.dataset.prop;
                const piece = scrapwoodPieces.find(p => p.id === id);
                if (piece) {
                    piece[prop] = parseFloat(input.value) || input.value;
                }
            });

            viewerCanvas.addEventListener('click', onCanvasClick);

            // --- Main Buttons ---
            document.getElementById('generate-btn').addEventListener('click', generateAssembly);
            document.getElementById('explode-view-btn').addEventListener('click', () => {}); // Placeholder
            document.getElementById('reset-view-btn').addEventListener('click', () => {});   // Placeholder
            document.getElementById('view-json-btn').addEventListener('click', viewJson);
            document.getElementById('download-json-btn').addEventListener('click', downloadJson);
            document.getElementById('upload-json-btn').addEventListener('click', () => document.getElementById('json-upload-input').click());
            document.getElementById('json-upload-input').addEventListener('change', handleJsonUpload);
            
            // --- Modal Buttons ---
            document.getElementById('close-modal-btn').addEventListener('click', () => document.getElementById('json-view-modal').style.display = 'none');
            document.getElementById('copy-json-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(document.getElementById('json-textarea').value);
                updateStatus('JSON copied to clipboard.');
            });

            // --- Freakyness Slider ---
             document.getElementById('freakyness-slider').addEventListener('input', (e) => {
                document.getElementById('freakyness-value').textContent = e.target.value;
            });
        }
        
        function onCanvasClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(objectGroup.children, true);
            
            // Deselect previous
            if (selectedPartMesh) {
                selectedPartMesh.material = defaultMaterial;
                selectedPartMesh = null;
            }
            infoBox.style.display = 'none';

            if (intersects.length > 0) {
                selectedPartMesh = intersects[0].object;
                selectedPartMesh.material = selectionMaterial;
                
                const partInfo = selectedPartMesh.userData.partInfo;
                if (partInfo) {
                    const d = partInfo.dimensions;
                    infoBox.innerHTML = `
                        <b>ID:</b> ${partInfo.id}<br>
                        <b>Size (cm):</b> ${(d.width*100).toFixed(1)} x ${(d.depth*100).toFixed(1)} x ${(d.height*100).toFixed(1)}
                    `;
                    infoBox.style.display = 'block';
                }
            }
        }

        async function generateAssembly() {
            const validPieces = scrapwoodPieces.filter(p => p.w > 0 && p.d > 0 && p.h > 0 && p.amount > 0);
            if (validPieces.length === 0) {
                updateStatus("Please add at least one valid scrapwood piece.");
                return;
            }
            const prompt = document.getElementById('prompt-input').value;
            if (!prompt.trim()) {
                updateStatus("Please describe what you want to build.");
                return;
            }

            updateStatus("Generating... this may take a moment.");
            document.getElementById('generate-btn').disabled = true;

            try {
                // Expand pieces based on amount and convert to meters
                const piecesInMeters = validPieces.flatMap(p => 
                    Array(p.amount).fill({ width: p.w / 100, depth: p.d / 100, height: p.h / 100 })
                );
                
                const payload = {
                    prompt: prompt,
                    scrapwood: piecesInMeters,
                    freakyness: parseFloat(document.getElementById('freakyness-slider').value)
                };

                const response = await fetch('/api/generate-from-scrapwood', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    const contentType = response.headers.get("content-type");
                    let errorMessage = await (contentType?.includes("application/json") ? response.json().then(e=>e.message) : response.text());
                    throw new Error(`Server error (${response.status}): ${errorMessage}`);
                }

                const result = await response.json();
                const newAssembly = JSON.parse(result.candidates[0].content.parts[0].text.replace(/```json\n|```/g, '').trim());
                createModel(newAssembly);

            } catch (error) {
                console.error("Generation Error:", error);
                updateStatus(`Error: ${error.message}`);
            } finally {
                document.getElementById('generate-btn').disabled = false;
            }
        }

        // --- JSON Functionality ---
        function viewJson() {
            if (!currentModelJson) {
                updateStatus('No model loaded to view.');
                return;
            }
            document.getElementById('json-textarea').value = JSON.stringify(currentModelJson, null, 2);
            document.getElementById('json-view-modal').style.display = 'flex';
        }

        function downloadJson() {
             if (!currentModelJson) {
                updateStatus('No model loaded to download.');
                return;
            }
            const blob = new Blob([JSON.stringify(currentModelJson, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${(currentModelJson.objectName || 'assembly').replace(/\s+/g, '_')}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
        }
        
        function handleJsonUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);
                    createModel(data);
                } catch (err) {
                    updateStatus(`Error parsing JSON file: ${err.message}`);
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset input
        }

        // --- INITIALIZATION ---
        init();
    </script>
</body>
</html>
