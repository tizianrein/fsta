<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formwood | The Scrapwood Assembler</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪵</text></svg>">
    <style>
        :root {
            --background: #FFFFFF;
            --foreground: #000000;
            --accent: #888888;
            --primary-blue: #007AFF;
        }
        html, body {
            height: 100%; margin: 0; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background); color: var(--foreground);
        }
        body { display: flex; }
        #ui-panel {
            width: 60%; min-width: 550px; max-width: 750px; padding: 40px;
            display: flex; flex-direction: column; overflow-y: auto;
            height: 100vh; box-sizing: border-box; border-right: 1px solid #EAEAEA;
        }
        #viewer-panel { flex-grow: 1; height: 100vh; position: relative; }
        #viewer-canvas { display: block; width: 100%; height: 100%; }
        h1 { margin: 0; font-size: 32px; font-weight: 600; }
        #header p { margin: 5px 0 0; color: var(--accent); font-size: 16px; }
        label { font-weight: 600; font-size: 14px; display: block; }
        .input-section { display: flex; flex-direction: column; gap: 15px; margin-top: 40px; }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn {
            padding: 12px 20px; font-size: 14px; font-weight: 600; border: 1px solid var(--foreground);
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn.primary { background-color: var(--foreground); color: var(--background); width: 100%; }
        .btn.secondary { background-color: var(--background); color: var(--foreground); }
        .btn:disabled { background-color: #ccc; border-color: #ccc; cursor: not-allowed; }
        .btn:hover:not(:disabled) { opacity: 0.7; }
        .input-field {
            width: 100%; border: 1px solid var(--foreground); background-color: var(--background);
            color: var(--foreground); padding: 12px; font-size: 14px; box-sizing: border-box;
        }
        #scrapwood-list { display: flex; flex-direction: column; gap: 10px; }
        .scrapwood-row { display: flex; gap: 10px; align-items: center; }
        .scrapwood-row input {
            width: 100%; border: 1px solid var(--foreground); padding: 12px;
            text-align: center; font-size: 14px;
        }
        .scrapwood-row .remove-piece-btn {
            border: 1px solid var(--foreground); background: white; width: 45px; height: 45px;
            padding: 0; font-size: 16px; cursor: pointer; flex-shrink: 0;
        }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; background: #EAEAEA; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: var(--primary-blue); cursor: pointer; border-radius: 50%; }
        input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; background: var(--primary-blue); cursor: pointer; border-radius: 50%; border: 0; }
        #gerrit-box {
            border: 1px solid var(--foreground); padding: 15px; font-family: "SF Mono", Consolas, Menlo, monospace;
            font-size: 14px; line-height: 1.6; min-height: 70px; margin-top: 40px;
        }
        #info-box { position: absolute; top: 10px; left: 10px; padding: 8px 12px; background-color: rgba(0, 0, 0, 0.7); color: white; border-radius: 4px; font-family: monospace; font-size: 13px; z-index: 100; display: none; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background-color: #fff; padding: 20px; width: 90%; max-width: 500px; }
        .modal-content textarea { width: 100%; height: 40vh; font-family: monospace; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="ui-panel">
        <div id="header">
            <h1>Formwood</h1>
            <p>The Scrapwood Assembler</p>
        </div>

        <div class="input-section">
            <label>1. Available Scrapwood (in cm)</label>
            <div id="scrapwood-list"></div>
            <button id="add-piece-btn" class="btn secondary">Add Piece +</button>
        </div>

        <div class="input-section">
            <label for="prompt-input">2. Assembly Instructions</label>
            <input type="text" id="prompt-input" class="input-field" placeholder="e.g., 'a small stool', 'a side table'">
        </div>

        <div class="input-section">
            <label for="freakyness-slider">3. Creativity: <span id="freakyness-value">0.5</span></label>
            <input type="range" id="freakyness-slider" min="0" max="1" step="0.1" value="0.5">
        </div>
        
        <div id="gerrit-box">
            <span id="gerrit-output"></span>
        </div>

        <button id="generate-btn" class="btn primary">Ask Gerrit to Build</button>
        
        <div class="controls-grid">
            <button id="explode-view-btn" class="btn secondary">Explode</button>
            <button id="view-json-btn" class="btn secondary">View JSON</button>
            <button id="download-json-btn" class="btn secondary">Download</button>
            <button id="upload-json-btn" class="btn secondary">Upload</button>
        </div>
    </div>

    <div id="viewer-panel">
        <canvas id="viewer-canvas"></canvas>
        <div id="info-box"></div>
    </div>

    <input type="file" id="json-upload-input" accept=".json, .txt" style="display:none;">
    <div id="json-view-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Current Assembly JSON</h3>
            <textarea id="json-textarea" readonly></textarea>
            <div class="modal-actions">
                <button id="copy-json-btn" class="btn primary">COPY</button>
                <button id="close-modal-btn" class="btn secondary">CLOSE</button>
            </div>
        </div>
    </div>

    <script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, raycaster, mouse;
        let scrapwoodPieces = [], currentModelJson = null, selectedPartMesh = null;
        let typingInterval = null, thinkingTimerInterval = null; // <-- NEW: Timer interval
        const objectGroup = new THREE.Group();
        const selectionMaterial = new THREE.MeshStandardMaterial({ color: 0x007AFF, side: THREE.DoubleSide });
        const outlineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.8 }); // <-- NEW: Outline material

        const viewerPanel = document.getElementById('viewer-panel');
        const viewerCanvas = document.getElementById('viewer-canvas');
        const gerritOutput = document.getElementById('gerrit-output');
        const generateBtn = document.getElementById('generate-btn');
        const scrapwoodList = document.getElementById('scrapwood-list');
        const infoBox = document.getElementById('info-box');
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            scene.add(objectGroup);
            camera = new THREE.PerspectiveCamera(50, viewerPanel.clientWidth / viewerPanel.clientHeight, 0.01, 1000);
            camera.position.set(0.8, 1.0, 1.2);
            renderer = new THREE.WebGLRenderer({ canvas: viewerCanvas, antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(viewerPanel.clientWidth, viewerPanel.clientHeight);
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            scene.add(new THREE.AmbientLight(0xffffff, 0.8), new THREE.DirectionalLight(0xffffff, 0.7));
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            setupEventListeners();
            addPieceRow();
            updateGerrit("Hello! I'm Gerrit. Provide some scrapwood and a prompt, and I'll design something for you.");
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function updateGerrit(message, isStatic = false) {
            if (typingInterval) clearInterval(typingInterval);
            const GERRIT_PREFIX = "Gerrit 💬: ";
            if (isStatic) {
                gerritOutput.innerHTML = `${GERRIT_PREFIX}${message}`;
            } else {
                gerritOutput.innerHTML = `${GERRIT_PREFIX}<span id="gerrit-text"></span><span class="cursor"></span>`;
                const textEl = document.getElementById('gerrit-text');
                const cursorEl = gerritOutput.querySelector('.cursor');
                if (!textEl || !cursorEl) return;
                let i = 0;
                typingInterval = setInterval(() => {
                    if (i < message.length) textEl.textContent += message.charAt(i++);
                    else {
                        clearInterval(typingInterval);
                        typingInterval = null;
                        if (cursorEl) cursorEl.style.display = 'none';
                    }
                }, 25);
            }
        }

        function addPieceRow(data = { w: '', d: '', h: '', amount: 1 }) {
            const id = `piece-${Date.now()}-${Math.random()}`;
            scrapwoodPieces.push({ id, ...data });
            const row = document.createElement('div');
            row.className = 'scrapwood-row';
            row.dataset.id = id;
            row.innerHTML = `
                <input type="number" placeholder="W" value="${data.w}" data-prop="w">
                <input type="number" placeholder="D" value="${data.d}" data-prop="d">
                <input type="number" placeholder="H" value="${data.h}" data-prop="h">
                <input type="number" placeholder="1" value="${data.amount}" data-prop="amount" min="1">
                <button class="remove-piece-btn" title="Remove piece">×</button>
            `;
            scrapwoodList.appendChild(row);
        }

        function setupEventListeners() {
            window.addEventListener('resize', onWindowResize);
            document.getElementById('add-piece-btn').addEventListener('click', () => addPieceRow());
            scrapwoodList.addEventListener('click', e => {
                if (e.target.classList.contains('remove-piece-btn')) {
                    const row = e.target.closest('.scrapwood-row');
                    if (!row) return;
                    scrapwoodPieces = scrapwoodPieces.filter(p => p.id !== row.dataset.id);
                    row.remove();
                }
            });
            scrapwoodList.addEventListener('input', e => {
                const input = e.target;
                const row = input.closest('.scrapwood-row');
                if (!row) return;
                const piece = scrapwoodPieces.find(p => p.id === row.dataset.id);
                if (piece) piece[input.dataset.prop] = parseFloat(input.value) || input.value;
            });
            viewerCanvas.addEventListener('click', onCanvasClick);
            generateBtn.addEventListener('click', generateAssembly);
            document.getElementById('view-json-btn').addEventListener('click', viewJson);
            document.getElementById('download-json-btn').addEventListener('click', downloadJson);
            document.getElementById('upload-json-btn').addEventListener('click', () => document.getElementById('json-upload-input').click());
            document.getElementById('json-upload-input').addEventListener('change', handleJsonUpload);
            document.getElementById('close-modal-btn').addEventListener('click', () => document.getElementById('json-view-modal').style.display = 'none');
            document.getElementById('copy-json-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(document.getElementById('json-textarea').value);
                updateGerrit("I've copied the JSON to your clipboard.", true);
            });
            document.getElementById('freakyness-slider').addEventListener('input', (e) => {
                document.getElementById('freakyness-value').textContent = e.target.value;
            });
        }
        
        async function generateAssembly() {
            const validPieces = scrapwoodPieces.filter(p => p.w > 0 && p.d > 0 && p.h > 0 && p.amount > 0);
            if (validPieces.length === 0) {
                updateGerrit("Please add at least one valid scrapwood piece before I can start.");
                return;
            }
            const prompt = document.getElementById('prompt-input').value;
            if (!prompt.trim()) {
                updateGerrit("I need some instructions! Please describe what you want me to build.");
                return;
            }

            // --- NEW: Start Thinking Timer ---
            let seconds = 0;
            const thinkingMessage = "Okay, let me think...";
            updateGerrit(`${thinkingMessage} (0s)`, true);
            thinkingTimerInterval = setInterval(() => {
                seconds++;
                updateGerrit(`${thinkingMessage} (${seconds}s)`, true);
            }, 1000);

            generateBtn.disabled = true;

            try {
                const piecesInMeters = validPieces.flatMap(p => Array(p.amount || 1).fill({ width: p.w / 100, depth: p.d / 100, height: p.h / 100 }));
                const payload = { prompt, scrapwood: piecesInMeters, freakyness: parseFloat(document.getElementById('freakyness-slider').value) };
                
                const response = await fetch('/api/old/generate-from-scrapwood', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) {
                    const contentType = response.headers.get("content-type");
                    let errorMessage = await (contentType?.includes("application/json") ? response.json().then(e => e.message) : response.text());
                    throw new Error(`${response.status}: ${errorMessage}`);
                }
                const result = await response.json();
                const newAssembly = JSON.parse(result.candidates[0].content.parts[0].text.replace(/```json\n|```/g, '').trim());
                createModel(newAssembly);

                // --- NEW: Material Usage Calculation ---
                const totalInitialVolume = piecesInMeters.reduce((acc, p) => acc + (p.width * p.depth * p.height), 0);
                const usedParts = newAssembly.parts.filter(p => p.status !== 'discarded');
                const usedVolume = usedParts.reduce((acc, p) => acc + (p.dimensions.width * p.dimensions.depth * p.dimensions.height), 0);
                const usagePercentage = totalInitialVolume > 0 ? (usedVolume / totalInitialVolume) * 100 : 0;

                updateGerrit(`Alright, I've designed a "${newAssembly.objectName}" for you. This design uses ${usagePercentage.toFixed(1)}% of your available materials. Take a look!`);

            } catch (error) {
                updateGerrit(`Oh, something went wrong. The server said: ${error.message}`);
            } finally {
                // --- NEW: Stop Thinking Timer ---
                if (thinkingTimerInterval) clearInterval(thinkingTimerInterval);
                thinkingTimerInterval = null;
                generateBtn.disabled = false;
            }
        }
        
        function onWindowResize() {
            camera.aspect = viewerPanel.clientWidth / viewerPanel.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewerPanel.clientWidth, viewerPanel.clientHeight);
        }

        function createModel(jsonData) {
            clearModel();
            currentModelJson = jsonData;
            const allPartsGroup = new THREE.Group();

            jsonData.parts.forEach(part => {
                if (part.status === 'discarded') return;

                // --- NEW: AI Colors & Outlines ---
                const geometry = new THREE.BoxGeometry(part.dimensions.width, part.dimensions.height, part.dimensions.depth);
                
                // 1. Create part material with AI-provided color (or fallback)
                const partColor = part.color || '#DEB887'; // Fallback to burlywood
                const partMaterial = new THREE.MeshStandardMaterial({ color: partColor, side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(geometry, partMaterial);

                // 2. Create the black outline
                const edges = new THREE.EdgesGeometry(geometry);
                const outline = new THREE.LineSegments(edges, outlineMaterial);

                // 3. Create a group to hold both mesh and outline
                const partGroup = new THREE.Group();
                partGroup.add(mesh);
                partGroup.add(outline);
                
                // 4. Store data and position the group
                partGroup.userData.partInfo = part;
                partGroup.userData.originalMaterial = partMaterial; // Store original material for deselection
                partGroup.userData.mesh = mesh; // Direct reference to the mesh for selection
                partGroup.position.set(part.origin.x, part.origin.y, part.origin.z);

                allPartsGroup.add(partGroup);
            });

            objectGroup.add(allPartsGroup);
            const bounds = new THREE.Box3().setFromObject(allPartsGroup);
            const center = bounds.getCenter(new THREE.Vector3());
            const size = bounds.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            controls.target.copy(center);
            camera.position.copy(center).add(new THREE.Vector3(1, 0.8, 1).normalize().multiplyScalar(maxDim * 2));
            camera.lookAt(center);
        }
        
        function clearModel() {
            while (objectGroup.children.length > 0) objectGroup.remove(objectGroup.children[0]);
            currentModelJson = null; selectedPartMesh = null; infoBox.style.display = 'none';
        }

        function onCanvasClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // --- MODIFIED: Raycast against the invisible meshes, not the groups ---
            const meshes = [];
            objectGroup.traverse(obj => { if (obj.isMesh) meshes.push(obj); });
            const intersects = raycaster.intersectObjects(meshes);

            // Deselect previous
            if (selectedPartMesh) {
                selectedPartMesh.material = selectedPartMesh.parent.userData.originalMaterial; // Revert to original material
                selectedPartMesh = null;
            }
            infoBox.style.display = 'none';

            if (intersects.length > 0) {
                selectedPartMesh = intersects[0].object; // The mesh itself is the intersected object
                selectedPartMesh.material = selectionMaterial; // Apply selection material
                
                const partInfo = selectedPartMesh.parent.userData.partInfo; // Get info from parent group
                if (partInfo) {
                    const d = partInfo.dimensions;
                    infoBox.innerHTML = `<b>ID:</b> ${partInfo.id}<br><b>Size (cm):</b> ${(d.width*100).toFixed(1)} x ${(d.depth*100).toFixed(1)} x ${(d.height*100).toFixed(1)}`;
                    infoBox.style.display = 'block';
                }
            }
        }

        function viewJson() {
            if (!currentModelJson) { updateGerrit("There's no model loaded to view."); return; }
            document.getElementById('json-textarea').value = JSON.stringify(currentModelJson, null, 2);
            document.getElementById('json-view-modal').style.display = 'flex';
        }
        function downloadJson() {
             if (!currentModelJson) { updateGerrit("There's nothing to download yet."); return; }
            const blob = new Blob([JSON.stringify(currentModelJson, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${(currentModelJson.objectName || 'assembly').replace(/\s+/g, '_')}.json`;
            a.click(); URL.revokeObjectURL(a.href);
        }
        function handleJsonUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);
                    createModel(data);
                    updateGerrit("Okay, I've loaded the assembly from your file.");
                } catch (err) {
                    updateGerrit(`I had trouble reading that file. Error: ${err.message}`);
                }
            };
            reader.readAsText(file); event.target.value = '';
        }

        init();
    </script>
</body>
